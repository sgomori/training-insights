default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: "*"
      threads: 3
      # JOB_CONCURRENCY only applies to `bin/jobs`. The deployment embeds Solid
      # Queue in Puma in async mode, which forces one process and ignores this
      # key — raise `threads` there, and the queue pool in config/database.yml
      # with it.
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
