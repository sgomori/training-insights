# Render blueprint for the canonical instance.
#
# Apply with: render blueprint launch  (or connect the repo in the dashboard)
# Secrets are marked `sync: false` and are set in the Render dashboard, never here.

services:
  - type: web
    name: training-insights
    runtime: ruby
    plan: starter
    region: ohio
    branch: main
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec puma -C config/puma.rb"
    healthCheckPath: /up
    domains:
      - training.stevegomori.ca
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: training-insights-db
          property: connectionString

      # Starter is 512MB. Puma runs single-mode and Solid Queue runs in async
      # mode inside it (see config/puma.rb), so the whole service is one Ruby
      # process.
      #
      # WEB_CONCURRENCY must stay 0 while that holds. Puma fires plugins from
      # the cluster master, so a worker count above zero would start the Solid
      # Queue supervisor in a process that serves no requests and, without
      # preload_app!, has not loaded the application. Scale with worker threads
      # in config/queue.yml and the pools in config/database.yml, or move jobs
      # to a service of their own.
      - key: WEB_CONCURRENCY
        value: 0
      - key: RAILS_MAX_THREADS
        value: 3
      - key: SOLID_QUEUE_IN_PUMA
        value: true

      # Connections available to the embedded queue: the supervisor, dispatcher,
      # worker and scheduler threads, plus request threads enqueuing jobs. Raise
      # it here if ConnectionTimeoutError appears in the logs — no deploy needed.
      - key: QUEUE_DB_POOL
        value: 16

      # glibc gives each thread its own malloc arena, up to 64MB of address
      # space apiece, and returns freed memory to the OS reluctantly. With
      # request threads and job threads in one process that makes resident
      # memory track thread count rather than live data. Two arenas trade a
      # little allocator contention for a much flatter memory profile.
      - key: MALLOC_ARENA_MAX
        value: 2

      - key: RAILS_ENV
        value: production

      # The MCP transport rejects any Host it does not recognise, so every
      # hostname the service answers on must be named or requests return 403.
      # Render serves the onrender.com hostname from the first deploy and the
      # custom domain only once DNS resolves, so both are listed until cutover.
      - key: MCP_ALLOWED_HOSTS
        value: training.stevegomori.ca,training-insights-ynpc.onrender.com
      - key: MCP_SERVER_URL
        value: https://training.stevegomori.ca/mcp

      - key: ANTHROPIC_CHAT_MODEL
        value: claude-opus-5
      - key: ANTHROPIC_CONTENT_MODEL
        value: claude-opus-5

      # Set in the dashboard.
      - key: RAILS_MASTER_KEY
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: MCP_API_KEY
        sync: false

databases:
  - name: training-insights-db
    plan: basic-1gb
    region: ohio
    databaseName: training_insights
    user: training_insights
